<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>🌈 Matematika Ceria - Pengurangan</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family:
                "Comic Sans MS",
                "Trebuchet MS",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #74ebd5,
                    #9face6
                );
        }

        .game {
            width: 100%;
            max-width: 950px;

            padding: 30px;

            text-align: center;

            background: white;

            border-radius: 30px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.18);
        }

        h1 {
            margin-bottom: 20px;

            color: #ff6b6b;

            font-size: 38px;

            text-shadow:
                2px 2px 0 #ffe66d;
        }

        .score {
            display: inline-block;

            margin-bottom: 25px;

            padding: 12px 22px;

            border-radius: 50px;

            background:
                linear-gradient(
                    135deg,
                    #fff3b0,
                    #ffd166
                );

            color: #7a4e00;

            font-size: 20px;

            font-weight: bold;
        }

        .score span {
            color: #e63946;

            font-size: 24px;
        }

        .question {
            margin-bottom: 20px;

            padding: 18px;

            border: 3px solid #b8ecff;

            border-radius: 20px;

            background: #e0f7ff;

            color: #1769aa;

            font-size: 24px;

            font-weight: bold;
        }

        .objects {
            margin: 25px 0;
        }

        .soal-pengurangan {
            display: flex;

            flex-wrap: wrap;

            justify-content: center;
            align-items: center;

            gap: 8px;

            padding: 25px;

            border: 4px dashed #ffca3a;

            border-radius: 25px;

            background:
                linear-gradient(
                    135deg,
                    #fff9db,
                    #fff1a8
                );

            box-shadow:
                0 8px 20px
                rgba(255, 202, 58, 0.25);
        }

        .angka {
            display: flex;

            justify-content: center;
            align-items: center;

            width: 65px;
            height: 65px;

            border: 4px solid #4dabf7;

            border-radius: 18px;

            background: white;

            color: #1971c2;

            font-size: 27px;

            font-weight: bold;

            box-shadow:
                0 5px 0 #339af0;

            animation:
                munculAngka 0.4s ease;
        }

        .operator {
            width: 25px;

            color: #ff6b6b;

            font-size: 32px;

            font-weight: bold;
        }

        .answers {
            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 15px;

            margin-top: 25px;
        }

        .answer {
            min-height: 70px;

            border: none;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #845ef7,
                    #5f3dc4
                );

            color: white;

            font-size: 28px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 7px 0 #43289b;

            transition:
                0.15s;
        }

        .answer:hover {
            transform:
                translateY(-4px);
        }

        .answer:active {
            transform:
                translateY(3px);
        }

        .answer.correct {
            background:
                linear-gradient(
                    135deg,
                    #51cf66,
                    #2f9e44
                );

            box-shadow:
                0 7px 0 #237a35;
        }

        .answer.wrong {
            background:
                linear-gradient(
                    135deg,
                    #ff6b6b,
                    #e03131
                );

            box-shadow:
                0 7px 0 #a61e1e;
        }

        .answer:disabled {
            cursor: not-allowed;
        }

        .message {
            min-height: 45px;

            margin-top: 20px;

            color: #495057;

            font-size: 21px;

            font-weight: bold;
        }

        .next {
            display: none;

            width: 100%;

            margin-top: 15px;

            padding: 17px;

            border: none;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #ff922b,
                    #f76707
                );

            color: white;

            font-size: 22px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 7px 0 #c94f00;
        }

        .hasil {
            padding: 20px;
        }

        .hasil-icon {
            font-size: 80px;
        }

        .hasil-title {
            margin: 20px 0;

            color: #ff6b6b;
        }

        .hasil-label {
            color: #868e96;

            font-size: 20px;
        }

        .hasil-score {
            margin: 10px 0;

            color: #845ef7;

            font-size: 60px;

            font-weight: bold;
        }

        .hasil-nilai {
            display: inline-block;

            padding: 12px 25px;

            border-radius: 50px;

            background: #fff3bf;

            color: #e67700;

            font-size: 28px;

            font-weight: bold;
        }

        .hasil-pesan {
            margin: 25px 0;

            font-size: 22px;

            font-weight: bold;
        }

        .main-lagi {
            width: 100%;

            padding: 18px;

            border: none;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #20c997,
                    #099268
                );

            color: white;

            font-size: 23px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 7px 0 #087456;
        }

        @keyframes munculAngka {

            from {
                opacity: 0;

                transform:
                    scale(0.5);
            }

            to {
                opacity: 1;

                transform:
                    scale(1);
            }

        }

        @media (max-width: 700px) {

            .game {
                padding: 20px;
            }

            h1 {
                font-size: 30px;
            }

            .answers {
                grid-template-columns:
                    repeat(3, 1fr);
            }

        }

        @media (max-width: 480px) {

            body {
                padding: 10px;
            }

            .game {
                padding: 15px;
            }

            h1 {
                font-size: 25px;
            }

            .question {
                font-size: 18px;
            }

            .soal-pengurangan {
                padding: 15px;

                gap: 4px;
            }

            .angka {
                width: 42px;
                height: 42px;

                border-width: 3px;

                border-radius: 10px;

                font-size: 17px;
            }

            .operator {
                width: 15px;

                font-size: 21px;
            }

            .answers {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 10px;
            }

            .answer {
                min-height: 60px;

                font-size: 23px;
            }

        }

    </style>
</head>


<body>

    <div
        class="game"
        id="game"
    >

        <h1>
            🌈 Matematika Ceria 🌈
        </h1>

        <div class="score">

            ⭐ Skor:
            <span id="score">0</span>

            &nbsp; | &nbsp;

            📝 Soal:
            <span id="nomorSoal">0</span>/10

        </div>


        <div
            class="question"
            id="question"
        >
            Hitunglah hasil pengurangan!
        </div>


        <div
            class="objects"
            id="objects"
        ></div>


        <div
            class="answers"
            id="answers"
        ></div>


        <div
            class="message"
            id="message"
        ></div>


        <button
            class="next"
            id="next"
            onclick="soalBerikutnya()"
        >
            ➡️ Soal Berikutnya
        </button>

    </div>


    <script>

        /* ==================================================
           PENGATURAN
        ================================================== */

        const TOTAL_SOAL = 10;

        const JUMLAH_ANGKA = 6;

        const ANGKA_PENGURANG_MIN = 9;

        const ANGKA_PENGURANG_MAX = 29;

        const ANGKA_PERTAMA_MIN = 85;

        const ANGKA_PERTAMA_MAX = 99;

        const JUMLAH_PILIHAN = 5;


        /* ==================================================
           VARIABEL
        ================================================== */

        let jawabanBenar = 0;

        let skor = 0;

        let nomorSoal = 0;

        let sudahMenjawab = false;


        /* ==================================================
           ANGKA ACAK
        ================================================== */

        function acak(min, max) {

            return Math.floor(
                Math.random() *
                (max - min + 1)
            ) + min;

        }


        /* ==================================================
           ACAK ARRAY
        ================================================== */

        function shuffle(array) {

            for (
                let i = array.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() *
                        (i + 1)
                    );

                [
                    array[i],
                    array[j]
                ] = [
                    array[j],
                    array[i]
                ];

            }

            return array;

        }


        /* ==================================================
           MEMBUAT SOAL PENGURANGAN
           
           Angka pertama:
           80 - 100

           7 angka berikutnya:
           10 - 25

           Hasil akhir:
           tidak boleh kurang dari 0
        ================================================== */

        function buatSoalPengurangan() {

            let angka = [];

            let hasil;


            /*
             * Karena angka pertama 80-100,
             * kita buat 7 angka pengurang.
             */

            angka.push(
                acak(
                    ANGKA_PERTAMA_MIN,
                    ANGKA_PERTAMA_MAX
                )
            );


            hasil = angka[0];


            for (
                let i = 1;
                i < JUMLAH_ANGKA;
                i++
            ) {

                /*
                 * Sisa hasil harus cukup
                 * untuk angka berikutnya.
                 */

                const sisaAngka =
                    JUMLAH_ANGKA - i;


                /*
                 * Nilai maksimum pengurang
                 * disesuaikan dengan hasil saat ini.
                 */

                const maxPengurang =
                    Math.min(
                        ANGKA_PENGURANG_MAX,
                        hasil -
                        (
                            sisaAngka *
                            ANGKA_PENGURANG_MIN
                        )
                    );


                /*
                 * Jika hasil terlalu kecil,
                 * mulai ulang pembuatan soal.
                 */

                if (
                    maxPengurang <
                    ANGKA_PENGURANG_MIN
                ) {

                    return buatSoalPengurangan();

                }


                const nilai =
                    acak(
                        ANGKA_PENGURANG_MIN,
                        maxPengurang
                    );


                angka.push(nilai);

                hasil -= nilai;

            }


            return {
                angka: angka,
                hasil: hasil
            };

        }


        /* ==================================================
           MEMBUAT 5 PILIHAN
        ================================================== */

        function buatPilihanJawaban(jawaban) {

            const pilihan = [
                jawaban
            ];


            while (
                pilihan.length <
                JUMLAH_PILIHAN
            ) {

                const selisih =
                    acak(1, 10);


                const arah =
                    Math.random() < 0.5
                        ? -1
                        : 1;


                const salah =
                    jawaban +
                    (
                        selisih *
                        arah
                    );


                if (
                    salah >= 0 &&
                    !pilihan.includes(salah)
                ) {

                    pilihan.push(
                        salah
                    );

                }

            }


            return shuffle(pilihan);

        }


        /* ==================================================
           BUAT SOAL
        ================================================== */

        function buatSoal() {

            sudahMenjawab = false;

            nomorSoal++;


            const objects =
                document.getElementById(
                    "objects"
                );


            const answers =
                document.getElementById(
                    "answers"
                );


            const message =
                document.getElementById(
                    "message"
                );


            const next =
                document.getElementById(
                    "next"
                );


            objects.innerHTML = "";

            answers.innerHTML = "";

            message.textContent = "";

            next.style.display = "none";


            document.getElementById(
                "nomorSoal"
            ).textContent =
                nomorSoal;


            /*
             * Buat soal.
             */

            const soal =
                buatSoalPengurangan();


            jawabanBenar =
                soal.hasil;


            /*
             * Judul soal.
             */

            document.getElementById(
                "question"
            ).textContent =
                `Soal ${nomorSoal} dari ${TOTAL_SOAL} — Hitunglah!`;


            /*
             * Kotak soal.
             */

            const soalElement =
                document.createElement(
                    "div"
                );


            soalElement.className =
                "soal-pengurangan";


            /*
             * Tampilkan 8 angka.
             */

            soal.angka.forEach(
                (nilai, index) => {

                    const angkaElement =
                        document.createElement(
                            "span"
                        );


                    angkaElement.className =
                        "angka";


                    angkaElement.textContent =
                        nilai;


                    soalElement.appendChild(
                        angkaElement
                    );


                    /*
                     * Tanda pengurangan.
                     */

                    if (
                        index <
                        soal.angka.length - 1
                    ) {

                        const operator =
                            document.createElement(
                                "span"
                            );


                        operator.className =
                            "operator";


                        operator.textContent =
                            "−";


                        soalElement.appendChild(
                            operator
                        );

                    }

                }
            );


            objects.appendChild(
                soalElement
            );


            /*
             * Buat pilihan.
             */

            const pilihan =
                buatPilihanJawaban(
                    jawabanBenar
                );


            pilihan.forEach(
                angkaJawaban => {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.className =
                        "answer";


                    button.textContent =
                        angkaJawaban;


                    button.onclick =
                        function () {

                            periksaJawaban(
                                angkaJawaban,
                                button
                            );

                        };


                    answers.appendChild(
                        button
                    );

                }
            );

        }


        /* ==================================================
           PERIKSA JAWABAN
        ================================================== */

        function periksaJawaban(
            jawaban,
            tombol
        ) {

            if (sudahMenjawab) {
                return;
            }


            sudahMenjawab = true;


            const semuaTombol =
                document.querySelectorAll(
                    ".answer"
                );


            const message =
                document.getElementById(
                    "message"
                );


            const next =
                document.getElementById(
                    "next"
                );


            /*
             * BENAR
             */

            if (
                jawaban === jawabanBenar
            ) {

                skor++;


                document.getElementById(
                    "score"
                ).textContent =
                    skor;


                tombol.classList.add(
                    "correct"
                );


                message.textContent =
                    "🎉 Hebat! Jawaban benar! ⭐";

            }


            /*
             * SALAH
             */

            else {

                tombol.classList.add(
                    "wrong"
                );


                message.textContent =
                    `😊 Belum tepat. Jawaban yang benar adalah ${jawabanBenar}`;


                /*
                 * Tandai jawaban benar.
                 */

                semuaTombol.forEach(
                    button => {

                        if (
                            Number(
                                button.textContent
                            ) === jawabanBenar
                        ) {

                            button.classList.add(
                                "correct"
                            );

                        }

                    }
                );

            }


            /*
             * Matikan semua tombol.
             */

            semuaTombol.forEach(
                button => {

                    button.disabled = true;

                }
            );


            /*
             * Tombol berikutnya.
             */

            if (
                nomorSoal === TOTAL_SOAL
            ) {

                next.textContent =
                    "🏆 Lihat Nilai";

            }

            else {

                next.textContent =
                    "➡️ Soal Berikutnya";

            }


            next.style.display =
                "block";

        }


        /* ==================================================
           SOAL BERIKUTNYA
        ================================================== */

        function soalBerikutnya() {

            if (
                nomorSoal >= TOTAL_SOAL
            ) {

                tampilkanHasil();

                return;

            }


            buatSoal();

        }


        /* ==================================================
           HASIL AKHIR
        ================================================== */

        function tampilkanHasil() {

            const game =
                document.getElementById(
                    "game"
                );


            const nilai =
                Math.round(
                    (
                        skor /
                        TOTAL_SOAL
                    ) * 100
                );


            let pesan;


            if (nilai === 100) {

                pesan =
                    "🌟 Sempurna! Kamu hebat sekali!";

            }

            else if (nilai >= 80) {

                pesan =
                    "🎉 Hebat! Terus berlatih ya!";

            }

            else if (nilai >= 60) {

                pesan =
                    "😊 Bagus! Ayo latihan lagi!";

            }

            else {

                pesan =
                    "💪 Jangan menyerah! Kamu pasti bisa!";

            }


            game.innerHTML = `

                <div class="hasil">

                    <div class="hasil-icon">
                        🏆
                    </div>

                    <h1 class="hasil-title">
                        🎉 Permainan Selesai! 🎉
                    </h1>

                    <div class="hasil-label">
                        Jawaban Benar
                    </div>

                    <div class="hasil-score">
                        ${skor} / ${TOTAL_SOAL}
                    </div>

                    <div class="hasil-nilai">
                        ⭐ Nilai: ${nilai}
                    </div>

                    <div class="hasil-pesan">
                        ${pesan}
                    </div>

                    <button
                        class="main-lagi"
                        onclick="mulaiLagi()"
                    >
                        🔄 Main Lagi
                    </button>

                </div>

            `;

        }


        /* ==================================================
           MAIN LAGI
        ================================================== */

        function mulaiLagi() {

            skor = 0;

            nomorSoal = 0;

            jawabanBenar = 0;

            sudahMenjawab = false;

            location.reload();

        }


        /* ==================================================
           MULAI GAME
        ================================================== */

        buatSoal();

    </script>

</body>

</html>
