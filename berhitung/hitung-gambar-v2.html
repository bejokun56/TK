<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Matematika Ceria TK</title>


    <style>

        /* =========================
           RESET
        ========================= */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }


        /* =========================
           BODY
        ========================= */

        body {

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #74d8ff,
                    #b9f6ca
                );

            min-height: 100vh;
            min-height: 100dvh;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 15px;
        }


        /* =========================
           GAME CONTAINER
        ========================= */

        .game {

            width: 100%;

            max-width: 700px;

            background: white;

            border-radius: 30px;

            padding:
                clamp(15px, 4vw, 30px);

            text-align: center;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, .15);
        }


        /* =========================
           JUDUL
        ========================= */

        h1 {

            margin:
                5px 0 10px;

            color: #ff6b6b;

            font-size:
                clamp(25px, 6vw, 36px);

            line-height: 1.2;
        }


        /* =========================
           SCORE
        ========================= */

        .score {

            font-size:
                clamp(17px, 4vw, 22px);

            font-weight: bold;

            color: #555;

            margin-bottom: 15px;
        }


        .score span {
            color: #ff922b;
        }


        /* =========================
           PERTANYAAN
        ========================= */

        .question {

            font-size:
                clamp(20px, 5vw, 28px);

            font-weight: bold;

            color: #444;

            margin: 15px 0;

            line-height: 1.4;
        }


        /* =========================
           AREA BENDA
        ========================= */

        .objects {

            width: 100%;

            height:
                clamp(200px, 45vw, 330px);

            min-height: 190px;

            position: relative;

            overflow: hidden;

            background: #fff8dc;

            border-radius: 25px;

            margin-bottom: 20px;

            border: 3px dashed #ffd43b;
        }


        /* =========================
           BENDA / EMOJI
        ========================= */

        .object {

            position: absolute;

            font-size:
                clamp(27px, 7vw, 42px);

            line-height: 1;

            user-select: none;

            pointer-events: none;

            animation:
                muncul .3s ease;

            transition:
                transform .2s ease;
        }


        @keyframes muncul {

            from {

                transform:
                    scale(0)
                    rotate(0deg);

                opacity: 0;
            }

            to {

                opacity: 1;
            }
        }


        /* =========================
           PILIHAN JAWABAN
        ========================= */

        .answers {

            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap:
                clamp(8px, 3vw, 15px);
        }


        .answer {

            width: 100%;

            border: none;

            border-radius: 20px;

            padding:
                clamp(12px, 4vw, 18px)
                8px;

            font-size:
                clamp(24px, 7vw, 34px);

            font-weight: bold;

            color: white;

            background: #4dabf7;

            cursor: pointer;

            box-shadow:
                0 5px 0 #339af0;

            transition:
                transform .15s,
                box-shadow .15s;
        }


        .answer:hover {

            transform:
                translateY(-3px);
        }


        .answer:active {

            transform:
                translateY(3px);

            box-shadow:
                0 2px 0 #339af0;
        }


        .answer:disabled {

            cursor: default;
        }


        /* =========================
           BENAR
        ========================= */

        .correct {

            background:
                #51cf66 !important;

            box-shadow:
                0 5px 0 #37b24d !important;
        }


        /* =========================
           SALAH
        ========================= */

        .wrong {

            background:
                #ff6b6b !important;

            box-shadow:
                0 5px 0 #fa5252 !important;
        }


        /* =========================
           PESAN
        ========================= */

        .message {

            min-height: 45px;

            margin-top: 20px;

            font-size:
                clamp(19px, 5vw, 26px);

            font-weight: bold;

            line-height: 1.3;
        }


        /* =========================
           TOMBOL BERIKUTNYA
        ========================= */

        .next {

            display: none;

            width: auto;

            max-width: 100%;

            border: none;

            background: #ffa94d;

            color: white;

            font-size:
                clamp(17px, 4vw, 23px);

            font-weight: bold;

            padding:
                14px 25px;

            border-radius: 18px;

            cursor: pointer;

            margin:
                10px auto 0;

            box-shadow:
                0 4px 0 #f08c00;

            transition: .15s;
        }


        .next:hover {

            background:
                #ff922b;

            transform:
                translateY(-2px);
        }


        .next:active {

            transform:
                translateY(2px);

            box-shadow:
                0 2px 0 #f08c00;
        }


        /* =========================
           HASIL AKHIR
        ========================= */

        .hasil {

            text-align: center;
        }


        .hasil-icon {

            font-size:
                clamp(55px, 15vw, 85px);

            margin:
                10px 0 15px;
        }


        .hasil-title {

            color: #ff6b6b;

            font-size:
                clamp(28px, 7vw, 40px);

            margin:
                10px 0;
        }


        .hasil-label {

            font-size:
                clamp(20px, 5vw, 27px);

            color: #555;

            font-weight: bold;

            margin-top: 15px;
        }


        .hasil-score {

            font-size:
                clamp(50px, 15vw, 75px);

            color: #51cf66;

            font-weight: bold;

            margin:
                5px 0;
        }


        .hasil-nilai {

            display: inline-block;

            background: #fff3bf;

            color: #f08c00;

            font-size:
                clamp(27px, 7vw, 38px);

            font-weight: bold;

            padding:
                12px 25px;

            border-radius: 20px;

            margin:
                10px 0 20px;
        }


        .hasil-pesan {

            font-size:
                clamp(19px, 5vw, 25px);

            font-weight: bold;

            color: #555;

            margin:
                10px 0 25px;

            line-height: 1.4;
        }


        .main-lagi {

            border: none;

            background: #4dabf7;

            color: white;

            font-size:
                clamp(18px, 5vw, 23px);

            font-weight: bold;

            padding:
                15px 30px;

            border-radius: 18px;

            cursor: pointer;

            box-shadow:
                0 5px 0 #339af0;

            transition: .15s;
        }


        .main-lagi:hover {

            background:
                #339af0;

            transform:
                translateY(-2px);
        }


        .main-lagi:active {

            transform:
                translateY(3px);

            box-shadow:
                0 2px 0 #339af0;
        }


        /* =========================
           HP KECIL
        ========================= */

        @media (max-width: 400px) {

            body {

                padding: 6px;

                align-items: center;
            }


            .game {

                padding:
                    14px 12px;

                border-radius: 22px;
            }


            h1 {

                margin:
                    2px 0 8px;
            }


            .score {

                margin-bottom: 10px;
            }


            .question {

                margin:
                    10px 0;
            }


            .objects {

                height: 220px;

                min-height: 180px;

                border-radius: 18px;
            }


            .object {

                font-size: 28px;
            }


            .answers {

                gap: 8px;
            }


            .answer {

                border-radius: 15px;

                padding:
                    13px 5px;
            }


            .message {

                margin-top: 15px;

                min-height: 40px;
            }


            .next {

                width: 100%;

                padding:
                    13px 15px;

                border-radius: 15px;
            }

        }


        /* =========================
           TABLET
        ========================= */

        @media (min-width: 600px) {

            .objects {

                height: 320px;
            }


            .object {

                font-size: 40px;
            }

        }


        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 900px) {

            body {

                padding: 30px;
            }


            .game {

                max-width: 700px;
            }


            .objects {

                height: 330px;
            }

        }


        /* =========================
           HP LANDSCAPE
        ========================= */

        @media (
            max-height: 550px
        ) and (
            orientation: landscape
        ) {

            body {

                align-items:
                    flex-start;

                padding: 10px;
            }


            .game {

                max-width: 750px;
            }


            h1 {

                font-size: 25px;

                margin:
                    3px 0;
            }


            .score {

                font-size: 17px;

                margin-bottom: 5px;
            }


            .question {

                font-size: 19px;

                margin:
                    5px 0;
            }


            .objects {

                height: 150px;

                min-height: 140px;

                margin-bottom: 10px;
            }


            .object {

                font-size: 25px;
            }


            .message {

                margin-top: 10px;

                min-height: 30px;

                font-size: 18px;
            }


            .next {

                padding:
                    10px 20px;
            }

        }

    </style>

</head>


<body>


<div class="game" id="game">

    <!-- =====================
         HALAMAN PERMAINAN
    ====================== -->

    <h1>
        🌈 Matematika Ceria 🌈
    </h1>


    <div class="score">

        ⭐ Skor:
        <span id="score">0</span>

        &nbsp; | &nbsp;

        📝 Soal:
        <span id="nomorSoal">0</span>/10

    </div>


    <div
        class="question"
        id="question"
    >
        Ada berapa benda?
    </div>


    <div
        class="objects"
        id="objects"
    ></div>


    <div
        class="answers"
        id="answers"
    ></div>


    <div
        class="message"
        id="message"
    ></div>


    <button
        class="next"
        id="next"
        onclick="soalBerikutnya()"
    >
        ➡️ Soal Berikutnya
    </button>

</div>



<script>

    /* =========================
       DATA BENDA
    ========================= */

    const benda = [

        "🍎",
        "🍊",
        "🍓",
        "🍌",
        "🍉",
        "🍇",
        "🍒",
        "🍍",
        "🥕",
        "🌽",
        "⭐",
        "❤️",
        "🌸",
        "🌻",
        "🌈",
        "☀️",
        "🌙",
        "☁️",
        "🐱",
        "🐶",
        "🐟",
        "🦋",
        "🐸",
        "🐰",
        "🐼",
        "🦁",
        "🐘",
        "🐵",
        "🚗",
        "🚌",
        "🚲",
        "✈️",
        "🚀",
        "🚂",
        "⚽",
        "🎈",
        "🎁",
        "🍭",
        "🍩",
        "🍪",
        "🎂",
        "🧸"

    ];


    /* =========================
       VARIABEL GAME
    ========================= */

    let jawabanBenar = 0;

    let skor = 0;

    let nomorSoal = 0;

    let sudahMenjawab = false;

    const TOTAL_SOAL = 10;


    /* =========================
       ANGKA ACAK
    ========================= */

    function acak(min, max) {

        return Math.floor(
            Math.random()
            * (max - min + 1)
        ) + min;

    }


    /* =========================
       ACAK ARRAY
    ========================= */

    function shuffle(array) {

        return array.sort(
            () => Math.random() - 0.5
        );

    }


    /* =========================
       CEK JARAK ANTAR BENDA
    ========================= */

    function posisiAman(
        x,
        y,
        posisi,
        jarakMinimum
    ) {

        for (
            const item of posisi
        ) {

            const dx =
                x - item.x;

            const dy =
                y - item.y;

            const jarak =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                jarak < jarakMinimum
            ) {

                return false;

            }

        }


        return true;

    }


    /* =========================
       MEMBUAT POSISI ACAK
       TANPA TERLALU BERTUMPUK
    ========================= */

    function buatPosisiAcak(
        jumlah,
        objects
    ) {

        const posisi = [];

        const lebar =
            objects.clientWidth;

        const tinggi =
            objects.clientHeight;


        /*
         * Ukuran perkiraan emoji.
         */

        const ukuran =
            window.innerWidth <= 400
                ? 30
                : window.innerWidth < 600
                    ? 35
                    : 42;


        /*
         * Jarak antar emoji.
         */

        const jarakMinimum =
            ukuran * 1.35;


        for (
            let i = 0;
            i < jumlah;
            i++
        ) {

            let berhasil = false;


            /*
             * Coba sampai 100 kali
             * mencari posisi kosong.
             */

            for (
                let percobaan = 0;
                percobaan < 100;
                percobaan++
            ) {

                const x =
                    acak(
                        ukuran,
                        Math.max(
                            ukuran,
                            lebar - ukuran
                        )
                    );


                const y =
                    acak(
                        ukuran,
                        Math.max(
                            ukuran,
                            tinggi - ukuran
                        )
                    );


                if (
                    posisiAman(
                        x,
                        y,
                        posisi,
                        jarakMinimum
                    )
                ) {

                    posisi.push({
                        x: x,
                        y: y
                    });

                    berhasil = true;

                    break;

                }

            }


            /*
             * Jika sudah terlalu penuh,
             * tetap masukkan posisi acak.
             */

            if (!berhasil) {

                posisi.push({

                    x: acak(
                        ukuran,
                        Math.max(
                            ukuran,
                            lebar - ukuran
                        )
                    ),

                    y: acak(
                        ukuran,
                        Math.max(
                            ukuran,
                            tinggi - ukuran
                        )
                    )

                });

            }

        }


        return posisi;

    }


    /* =========================
       MEMBUAT SOAL
    ========================= */

    function buatSoal() {

        sudahMenjawab = false;


        nomorSoal++;


        const objects =
            document.getElementById(
                "objects"
            );


        const answers =
            document.getElementById(
                "answers"
            );


        const message =
            document.getElementById(
                "message"
            );


        const next =
            document.getElementById(
                "next"
            );


        /* Reset */

        objects.innerHTML = "";

        answers.innerHTML = "";

        message.textContent = "";

        next.style.display = "none";


        /* Update nomor soal */

        document.getElementById(
            "nomorSoal"
        ).textContent =
            nomorSoal;


        /* Pilih benda */

        const emoji =
            benda[
                acak(
                    0,
                    benda.length - 1
                )
            ];


        /* Jumlah benda */

        jawabanBenar =
            acak(10, 30);


        /* Pertanyaan */

        document.getElementById(
            "question"
        ).textContent =

            "Soal " +
            nomorSoal +
            " dari " +
            TOTAL_SOAL +
            " — Ada berapa " +
            namaBenda(emoji) +
            "?";


        /*
         * Buat posisi acak terlebih dahulu.
         */

        const posisi =
            buatPosisiAcak(
                jawabanBenar,
                objects
            );


        /* =====================
           BUAT BENDA
        ====================== */

        for (
            let i = 0;
            i < jawabanBenar;
            i++
        ) {

            const span =
                document.createElement(
                    "span"
                );


            span.className =
                "object";


            span.textContent =
                emoji;


            /*
             * Posisi acak.
             */

            span.style.left =
                posisi[i].x + "px";


            span.style.top =
                posisi[i].y + "px";


            /*
             * Rotasi acak.
             */

            const rotasi =
                acak(-20, 20);


            /*
             * Sedikit variasi ukuran
             * supaya terlihat lebih alami.
             */

            const skala =
                (acak(90, 110) / 100);


            span.style.transform =
                `translate(-50%, -50%)
                 rotate(${rotasi}deg)
                 scale(${skala})`;


            objects.appendChild(
                span
            );

        }


        /* =====================
           PILIHAN JAWABAN
        ====================== */

        let pilihan = [
            jawabanBenar
        ];


        while (
            pilihan.length < 3
        ) {

            const salah =
                acak(

                    Math.max(
                        10,
                        jawabanBenar - 3
                    ),

                    Math.min(
                        30,
                        jawabanBenar + 3
                    )

                );


            if (
                !pilihan.includes(salah)
            ) {

                pilihan.push(salah);

            }

        }


        shuffle(pilihan);


        /* =====================
           BUAT TOMBOL JAWABAN
        ====================== */

        pilihan.forEach(
            angka => {

                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "answer";


                button.textContent =
                    angka;


                button.onclick =
                    function () {

                        periksaJawaban(
                            angka,
                            button
                        );

                    };


                answers.appendChild(
                    button
                );

            }
        );

    }


    /* =========================
       NAMA BENDA
    ========================= */

    function namaBenda(emoji) {

        const nama = {

            "🍎": "apel",
            "🍊": "jeruk",
            "🍓": "stroberi",
            "🍌": "pisang",
            "🍉": "semangka",
            "🍇": "anggur",
            "🍒": "ceri",
            "🍍": "nanas",
            "🥕": "wortel",
            "🌽": "jagung",
            "⭐": "bintang",
            "❤️": "hati",
            "🌸": "bunga",
            "🌻": "bunga matahari",
            "🌈": "pelangi",
            "☀️": "matahari",
            "🌙": "bulan",
            "☁️": "awan",
            "🐱": "kucing",
            "🐶": "anjing",
            "🐟": "ikan",
            "🦋": "kupu-kupu",
            "🐸": "katak",
            "🐰": "kelinci",
            "🐼": "panda",
            "🦁": "singa",
            "🐘": "gajah",
            "🐵": "monyet",
            "🚗": "mobil",
            "🚌": "bus",
            "🚲": "sepeda",
            "✈️": "pesawat",
            "🚀": "roket",
            "🚂": "kereta",
            "⚽": "bola",
            "🎈": "balon",
            "🎁": "hadiah",
            "🍭": "lolipop",
            "🍩": "donat",
            "🍪": "biskuit",
            "🎂": "kue",
            "🧸": "boneka"

        };


        return (
            nama[emoji] ||
            "benda"
        );

    }


    /* =========================
       PERIKSA JAWABAN
    ========================= */

    function periksaJawaban(
        jawaban,
        tombol
    ) {

        /* Cegah klik dua kali */

        if (sudahMenjawab) {

            return;

        }


        sudahMenjawab = true;


        const semuaTombol =
            document.querySelectorAll(
                ".answer"
            );


        const message =
            document.getElementById(
                "message"
            );


        /* =====================
           JAWABAN BENAR
        ====================== */

        if (
            jawaban === jawabanBenar
        ) {

            skor++;


            document.getElementById(
                "score"
            ).textContent =
                skor;


            tombol.classList.add(
                "correct"
            );


            message.textContent =
                "🎉 Hebat! Jawaban benar! ⭐";

        }


        /* =====================
           JAWABAN SALAH
        ====================== */

        else {

            tombol.classList.add(
                "wrong"
            );


            message.textContent =
                "😊 Belum tepat. Jawabannya " +
                jawabanBenar;


            /*
             * Tampilkan jawaban benar.
             */

            semuaTombol.forEach(
                btn => {

                    if (
                        Number(
                            btn.textContent
                        ) === jawabanBenar
                    ) {

                        btn.classList.add(
                            "correct"
                        );

                    }

                }
            );

        }


        /* Nonaktifkan semua tombol */

        semuaTombol.forEach(
            btn => {

                btn.disabled = true;

            }
        );


        /* =====================
           TOMBOL BERIKUTNYA
        ====================== */

        const next =
            document.getElementById(
                "next"
            );


        if (
            nomorSoal === TOTAL_SOAL
        ) {

            next.textContent =
                "🏆 Lihat Nilai";

        }

        else {

            next.textContent =
                "➡️ Soal Berikutnya";

        }


        next.style.display =
            "block";

    }


    /* =========================
       SOAL BERIKUTNYA
    ========================= */

    function soalBerikutnya() {

        if (
            nomorSoal >= TOTAL_SOAL
        ) {

            tampilkanHasil();

            return;

        }


        buatSoal();

    }


    /* =========================
       TAMPILKAN HASIL
    ========================= */

    function tampilkanHasil() {

        const game =
            document.getElementById(
                "game"
            );


        /* Hitung nilai */

        const nilai =
            Math.round(
                (
                    skor /
                    TOTAL_SOAL
                ) * 100
            );


        /* Pesan berdasarkan nilai */

        let pesan = "";


        if (nilai === 100) {

            pesan =
                "🌟 Sempurna! Kamu hebat sekali!";

        }

        else if (nilai >= 80) {

            pesan =
                "🎉 Hebat! Terus berlatih ya!";

        }

        else if (nilai >= 60) {

            pesan =
                "😊 Bagus! Ayo latihan lagi!";

        }

        else {

            pesan =
                "💪 Jangan menyerah! Kamu pasti bisa!";

        }


        /* =====================
           TAMPILKAN HASIL
        ====================== */

        game.innerHTML = `

            <div class="hasil">

                <div class="hasil-icon">
                    🏆
                </div>


                <h1 class="hasil-title">
                    🎉 Permainan Selesai! 🎉
                </h1>


                <div class="hasil-label">
                    Jawaban Benar
                </div>


                <div class="hasil-score">
                    ${skor} / ${TOTAL_SOAL}
                </div>


                <div class="hasil-nilai">
                    ⭐ Nilai: ${nilai}
                </div>


                <div class="hasil-pesan">
                    ${pesan}
                </div>


                <button
                    class="main-lagi"
                    onclick="mulaiLagi()"
                >
                    🔄 Main Lagi
                </button>

            </div>

        `;

    }


    /* =========================
       MULAI LAGI
    ========================= */

    function mulaiLagi() {

        skor = 0;

        nomorSoal = 0;

        jawabanBenar = 0;

        sudahMenjawab = false;


        location.reload();

    }


    /* =========================
       MULAI GAME
    ========================= */

    buatSoal();

</script>

</body>

</html>
