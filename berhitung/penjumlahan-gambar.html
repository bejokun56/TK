                    #74ebd5,

        }

            text-align: center;

            animation: muncul 0.5s ease;
        }

            text-shadow:
                2px 2px 0 #ffe66d;
        }

            display: inline-block;

            border-radius: 50px;

            background:

                    135deg,
                    #fff3b0,
                    #ffd166
                );

            color: #7a4e00;

            font-size: 20px;

            font-weight: bold;

            box-shadow:
                0 5px 12px
                rgba(0, 0, 0, 0.12);
        }

        .score span {
            color: #e63946;

            font-size: 24px;
        }

        .question {
            margin-bottom: 25px;

            padding: 18px;

            border: 3px solid #b8ecff;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #e0f7ff,
                    #d9f8ff
                );

            color: #1769aa;

            font-size: 24px;

            font-weight: bold;
        }

        .objects {
            margin: 25px 0;
        }

        .soal-gambar {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 20px;

            padding: 25px;

            border: 4px dashed #ffca3a;

            border-radius: 25px;

            background:
                linear-gradient(
                    135deg,
                    #fff9db,
                    #fff1a8
                );

            box-shadow:
                0 8px 20px
                rgba(255, 202, 58, 0.25);
        }

        .kelompok {
            flex: 1;

            min-width: 0;

            padding: 15px;

            border-radius: 20px;

            background:
                rgba(255, 255, 255, 0.85);
        }

        .nama-benda {
            margin-bottom: 12px;

            color: #1769aa;

            font-size: 21px;

            font-weight: bold;
        }

        .gambar-benda {
            display: grid;

            grid-template-columns:
                repeat(10, 1fr);

            gap: 5px;

            align-items: center;

            justify-items: center;

            min-height: 120px;

            padding: 8px;

            font-size: 32px;

            line-height: 1.2;
        }

        .gambar-benda span {
            display: flex;

            align-items: center;

            justify-content: center;

            width: 100%;

            min-width: 25px;

            min-height: 30px;

            animation:
                gambarMasuk 0.25s ease;
        }

        .jumlah {
            margin-top: 10px;

            color: #e67700;

            font-size: 19px;

            font-weight: bold;
        }

        .plus {
            flex-shrink: 0;

            color: #ff6b6b;

            font-size: 45px;

            font-weight: bold;
        }

        .hasil-pertanyaan {
            margin-top: 20px;

            color: #845ef7;

            font-size: 32px;

            font-weight: bold;
        }

        .answers {
            display: grid;

            grid-template-columns:
                repeat(6, 1fr);

            gap: 12px;

            margin-top: 25px;
        }

        .answer {
            min-height: 70px;

            border: none;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #845ef7,
                    #5f3dc4
                );

            color: #ffffff;

            font-size: 26px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 7px 0 #43289b;

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .answer:hover {
            transform:
                translateY(-4px);

            box-shadow:
                0 11px 0 #43289b;
        }

        .answer:active {
            transform:
                translateY(4px);

            box-shadow:
                0 3px 0 #43289b;
        }

        .answer.correct {
            background:
                linear-gradient(
                    135deg,
                    #51cf66,
                    #2f9e44
                );

            box-shadow:
                0 7px 0 #237a35;

            animation:
                benar 0.5s ease;
        }

        .answer.wrong {
            background:
                linear-gradient(
                    135deg,
                    #ff6b6b,
                    #e03131
                );

            box-shadow:
                0 7px 0 #a61e1e;

            animation:
                salah 0.4s ease;
        }

        .answer:disabled {
            cursor: not-allowed;

            opacity: 0.9;
        }

        .message {
            min-height: 45px;

            margin-top: 20px;

            color: #495057;

            font-size: 21px;

            font-weight: bold;
        }

        .next {

            margin-top: 15px;

            padding: 17px;

            border: none;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #ff922b,
                    #f76707
                );

            color: #ffffff;

            font-size: 22px;

            font-weight: bold;

            box-shadow:
                0 7px 0 #c94f00;

            transition:

        }

        .next:hover {
            transform:
                translateY(-3px);
        }

        .next:active {
            transform:
                translateY(3px);

            box-shadow:
                0 3px 0 #c94f00;
        }

        .hasil {
            padding: 20px;
        }

            margin-bottom: 10px;

        }

        @keyframes muncul {
            from {
                opacity: 0;

                transform:
                    translateY(25px)
                    scale(0.95);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }

        @keyframes gambarMasuk {
            from {
                opacity: 0;

                transform:
                    scale(0.5)
                    rotate(-10deg);
            }

            to {
                opacity: 1;

                transform:
                    scale(1)
                    rotate(0);
            }
        }

        @keyframes benar {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes salah {
            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-8px);
            }

            75% {
                transform: translateX(8px);
            }
        }

        @keyframes loncat {
            0%,
            100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-12px);
            }
        }

            }

            }

            }

            }

                    repeat(3, 1fr);
            }
        }

            }

            }

                font-size: 26px;
            }

            .answers {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 10px;
            }

            .answer {
                min-height: 60px;

                font-size: 23px;
            }

            .message {
                font-size: 18px;
            }

            .next {
                padding: 15px;

                font-size: 19px;
            }

            .hasil-icon {
                font-size: 65px;
            }

            .hasil-score {
                font-size: 48px;
            }

            .hasil-nilai {
                font-size: 23px;
            }
        }
    </style>
</head>

        let jawabanBenar = 0;

        /* ================================
           ANGKA ACAK
        ================================= */

        function acak(min, max) {
            return Math.floor(
                Math.random() *
                (max - min + 1)
            ) + min;
        }


        /* ================================
           ACAK ARRAY
        ================================= */

        function shuffle(array) {

            for (
                let i = array.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() *
                        (i + 1)
                    );

                [
                    array[i],
                    array[j]
                ] = [
                    array[j],
                    array[i]
                ];
            }

            return array;
        }


        /* ================================
           MEMBUAT GAMBAR
        ================================= */

        function buatGambar(
            benda,
            jumlah
        ) {

            let html = "";

            for (
                let i = 0;
                i < jumlah;
                i++
            ) {

                html += `
                    <span>
                        ${benda.gambar}
                    </span>
                `;
            }

            return html;
        }


        /* ================================
           MEMBUAT SOAL
        ================================= */

        function buatSoalGambar() {

            /*
               Jumlah gambar pertama
            */

            const jumlah1 =
                acak(
                    JUMLAH_MIN,
                    JUMLAH_MAX
                );


            /*
               Jumlah gambar kedua
            */

            const jumlah2 =
                acak(
                    JUMLAH_MIN,
                    JUMLAH_MAX
                );


            /*
               Jawaban benar
            */

            const total =
                jumlah1 + jumlah2;


            /*
               Pilih gambar pertama
            */

            const indeks1 =
                acak(
                    0,
                    BENDA.length - 1
                );


            /*
               Pilih gambar kedua
               dan pastikan berbeda
            */

            let indeks2;

            do {

                indeks2 =
                    acak(
                        0,
                        BENDA.length - 1
                    );

            } while (
                indeks2 === indeks1
            );


            return {

                benda1:
                    BENDA[indeks1],

                benda2:
                    BENDA[indeks2],

                jumlah1:
                    jumlah1,

                jumlah2:
                    jumlah2,

                total:
                    total
            };
        }


        /* ================================
           MEMBUAT PILIHAN JAWABAN
        ================================= */

        function buatPilihanJawaban(
            jawaban
        ) {

            const pilihan = [
                jawaban
            ];


            /*
               Karena jumlah maksimal
               adalah 29 + 29 = 58,
               maka pilihan jawaban
               berada di sekitar jawaban
               yang benar.
            */

            while (
                pilihan.length <
                JUMLAH_PILIHAN
            ) {

                const selisih =
                    acak(1, 10);


                const arah =
                    Math.random() < 0.5
                        ? -1
                        : 1;


                const jawabanSalah =
                    jawaban +
                    (
                        selisih * arah
                    );


                /*
                   Jawaban minimal
                   adalah 18
                   karena 9 + 9 = 18.
                */

                const totalMinimum =
                    JUMLAH_MIN * 2;


                /*
                   Jawaban maksimal
                   adalah 58
                   karena 29 + 29 = 58.
                */

                const totalMaksimum =
                    JUMLAH_MAX * 2;


                if (
                    jawabanSalah >=
                        totalMinimum &&

                    jawabanSalah <=
                        totalMaksimum &&

                    !pilihan.includes(
                        jawabanSalah
                    )
                ) {

                    pilihan.push(
                        jawabanSalah
                    );
                }
            }


            return shuffle(
                pilihan
            );
        }

                document.createElement(
                    "div"
                );

            plus.className =
                "plus";

            plus.textContent = "+";


            /*
               KELOMPOK KEDUA
            */

            const kelompok2 =
                document.createElement(
                    "div"
                );

            kelompok2.className =
                "kelompok";


            kelompok2.innerHTML = `

                <div class="gambar-benda">
                    ${buatGambar(
                        soal.benda2,
                        soal.jumlah2
                    )}
                </div>
            `;


            /*
               Masukkan ke halaman
            */

            soalElement.appendChild(
                kelompok1
            );

            soalElement.appendChild(
                plus
            );

            soalElement.appendChild(
                kelompok2
            );


            objects.appendChild(
                soalElement
            );


            /*
               Tanda pertanyaan
            */

            const tandaTanya =
                document.createElement(
                    "div"
                );

            tandaTanya.className =
                "hasil-pertanyaan";

            tandaTanya.textContent =
                "❓ = ?";


            objects.appendChild(
                tandaTanya
            );


            /*
               Buat pilihan jawaban
            */

            const pilihan =
                buatPilihanJawaban(
                    jawabanBenar
                );


            pilihan.forEach(
                angkaJawaban => {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.className =
                        "answer";


                    button.textContent =
                        angkaJawaban;


                    button.onclick =
                        function () {

                            periksaJawaban(
                                angkaJawaban,
                                button
                            );
                        };


                    answers.appendChild(
                        button
                    );
                }
            );
        }


        /* ================================
           PERIKSA JAWABAN
        ================================= */

        function periksaJawaban(
            jawaban,
            tombol
        ) {

            if (sudahMenjawab) {
                return;
            }


            sudahMenjawab = true;


            const semuaTombol =
                document.querySelectorAll(
                    ".answer"
                );


            const message =
                document.getElementById(
                    "message"
                );


            const next =
                document.getElementById(
                    "next"
                );


            /*
               JAWABAN BENAR
            */

            if (
                jawaban ===
                jawabanBenar
            ) {

                skor++;


                document.getElementById(
                    "score"
                ).textContent =
                    skor;


                tombol.classList.add(
                    "correct"
                );


                message.textContent =
                    "🎉 Hebat! Jawaban benar! ⭐";

            }


            /*
               JAWABAN SALAH
            */

            else {

                tombol.classList.add(
                    "wrong"
                );


                message.textContent =
                    `😊 Belum tepat. Jawaban yang benar adalah ${jawabanBenar}`;


                /*
                   Tampilkan jawaban benar
                */

                semuaTombol.forEach(
                    button => {

                        if (
                            Number(
                                button.textContent
                            ) ===
                            jawabanBenar
                        ) {

                            button.classList.add(
                                "correct"
                            );
                        }
                    }
                );
            }


            /*
               Nonaktifkan semua tombol
            */

            semuaTombol.forEach(
                button => {

                    button.disabled =
                        true;
                }
            );


            /*
               Tombol berikutnya
            */

            if (
                nomorSoal ===
                TOTAL_SOAL
            ) {

                next.textContent =
                    "🏆 Lihat Nilai";

            } else {

                next.textContent =
                    "➡️ Soal Berikutnya";
            }


            next.style.display =
                "block";
        }


        /* ================================
           SOAL BERIKUTNYA
        ================================= */

        function soalBerikutnya() {

            if (
                nomorSoal >=
                TOTAL_SOAL
            ) {

                tampilkanHasil();

                return;
            }


            buatSoal();
        }


        /* ================================
           TAMPILKAN HASIL
        ================================= */

        function tampilkanHasil() {

            const game =
                document.getElementById(
                    "game"
                );


            const nilai =
                Math.round(
                    (
                        skor /
                        TOTAL_SOAL
                    ) * 100
                );


            let pesan;


            if (nilai === 100) {

                pesan =
                    "🌟 Sempurna! Kamu hebat sekali!";

            }

            else if (nilai >= 80) {

                pesan =
                    "🎉 Hebat! Terus berlatih ya!";

            }

            else if (nilai >= 60) {

                pesan =
                    "😊 Bagus! Ayo latihan lagi!";

            }

            else {

                pesan =
                    "💪 Jangan menyerah! Kamu pasti bisa!";
            }


            game.innerHTML = `

                <div class="hasil">

                    <div class="hasil-icon">
                        🏆
                    </div>

                    <h1 class="hasil-title">
                        🎉 Permainan Selesai! 🎉
                    </h1>

                    <div class="hasil-label">
                        Jawaban Benar
                    </div>

                    <div class="hasil-score">
                        ${skor} / ${TOTAL_SOAL}
                    </div>

                    <div class="hasil-nilai">
                        ⭐ Nilai: ${nilai}
                    </div>

                    <div class="hasil-pesan">
                        ${pesan}
                    </div>

                    <button
                        class="main-lagi"
                        onclick="mulaiLagi()"
                    >
                        🔄 Main Lagi
                    </button>

                </div>

            `;
        }


        /* ================================
           MULAI LAGI
        ================================= */

        function mulaiLagi() {

            skor = 0;

            nomorSoal = 0;

            jawabanBenar = 0;

            sudahMenjawab = false;

            location.reload();
        }


        /* ================================
           MULAI GAME
        ================================= */

        buatSoal();

    </script>

</body>

</html>
